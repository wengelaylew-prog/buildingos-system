<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Building &amp; Tenant Management System</title>
    <script>
      // Disable React DevTools in production to prevent component inspection
      if (typeof window !== 'undefined' && window.location.hostname !== 'localhost') {
        window.__REACT_DEVTOOLS_GLOBAL_HOOK__ = {
          supportsFiber: true,
          inject: function() {},
          onCommitFiberRoot: function() {},
          onCommitFiberUnmount: function() {},
        };
      }
      // Disable right-click (context menu) to discourage simple inspection
      document.addEventListener('contextmenu', event => {
        if (window.location.hostname !== 'localhost') event.preventDefault();
      });
      // Disable F12 and Ctrl+Shift+I shortcuts
      document.addEventListener('keydown', function(e) {
        if (window.location.hostname !== 'localhost') {
          if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) {
            e.preventDefault();
          }
        }
      });
    </script>
    <meta name="description" content="Production-grade property, building, unit, tenant, contract, and document management system powered by wengel aylew." />
    <meta property="og:title" content="Building &amp; Tenant Management System" />
    <meta property="og:description" content="Production-grade property, building, unit, tenant, contract, and document management system powered by wengel aylew." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
