services:
  - type: web
    name: buildingos-app
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: buildingos-db
          property: connectionString

databases:
  - name: buildingos-db
    region: frankfurt
    plan: free

