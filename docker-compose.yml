version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buildingos_app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/buildingos
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      - buildingos_net

  db:
    image: postgres:15-alpine
    container_name: buildingos_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: buildingos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d buildingos"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - buildingos_net

volumes:
  pgdata:

networks:
  buildingos_net:
    driver: bridge

